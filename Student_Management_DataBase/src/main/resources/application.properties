spring.application.name=Student_Management_DataBase

server.port= 5959

#DataBase Configuirations Or Properties Which are used to connect to MYSQL DataBase
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.jdbc.Driver


#This Will Show the SQL Queries Running Internally in Console
spring.jpa.show-sql=true

#For Automatically Update Database After Change
spring.jpa.hibernate.ddl-auto=update

#It Converts the Java Data Types into Database data Types
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
